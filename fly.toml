app = "codeflow"
primary_region = "iad"

[build]
  builder = "heroku/buildpacks:20"

[build.env]
  NODE_ENV = "production"

[[services]]
  internal_port = 3001
  protocol = "http"

  [[services.ports]]
    port = 3001

  [[services.routes]]
    path = "/api"
    preserve_path_prefix = true

  [[services.routes]]
    path = "/socket.io"
    preserve_path_prefix = true

  [services.concurrency]
    hard_limit = 100
    soft_limit = 80

  [[services.tcp_checks]]
    interval = 10000
    timeout = 2000
    restart_limit = 3
